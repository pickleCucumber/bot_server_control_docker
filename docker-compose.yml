version: '3.8'

services:
  bot:
    build: .
    container_name: telegram_bot_control
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro 
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge
